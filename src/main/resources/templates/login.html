<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Log in | CarSales</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="navbar">
    <div class="container nav-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">C</span>
            CarSales
        </a>
        <a class="btn btn-outline" th:href="@{/signup}">
            Create account
        </a>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <div class="auth-heading">
            <div class="brand-mark">C</div>
            <h1>Welcome back.</h1>
            <p>Sign in to continue your CarSales journey.</p>
        </div>

        <div class="alert alert-error"
             th:if="${param.error}">
            Your username or password is incorrect. Please try again.
        </div>

        <div class="alert alert-success"
             th:if="${param.logout}">
            You have been logged out successfully.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label class="form-label" for="email">
                    Username
                </label>
                <input autocomplete="username"
                       autofocus
                       class="form-input"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required
                       type="text">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    Password
                </label>
                <input autocomplete="current-password"
                       class="form-input"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required
                       type="password">
            </div>

            <button class="btn btn-primary btn-full" type="submit">
                Log in &rarr;
            </button>
        </form>

        <p class="auth-switch">
            New to CarSales?
            <a th:href="@{/signup}">Create an account</a>
        </p>

        <p class="auth-switch">
            <a th:href="@{/}">← Back to homepage</a>
        </p>
    </section>
</main>

<footer class="footer">
    <div class="container footer-inner">
        <span>© 2026 CarSales</span>
        <span>Made for the road ahead.</span>
    </div>
</footer>

</body>
</html>
