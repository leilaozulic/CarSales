<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Verify your CarSales email</title>
</head>
<body style="margin: 0; padding: 30px; font-family: Arial, sans-serif;
             background-color: #f4f4f5; color: #333333;">

<div style="max-width: 560px; margin: 0 auto; padding: 32px;
                background-color: #ffffff; border-radius: 12px;">

    <h1 style="text-align: center; color: #2563eb;">
        Welcome to CarSales!
    </h1>

    <p>Hi there,</p>

    <p>
        Thanks for creating your CarSales account!
        Please verify your email address to activate your account.
    </p>

    <div style="text-align: center; margin: 32px 0;">
        <a href="#"
           style="display: inline-block; padding: 14px 24px;
                      background-color: #2563eb; color: #ffffff;
                      text-decoration: none; border-radius: 6px;
                      font-weight: bold;"
           th:href="${verificationUrl}">
            Verify my email
        </a>
    </div>

    <p>
        This link expires in 24 hours.
    </p>

    <p>
        If you didn't create this account, you can safely ignore this email.
    </p>

    <hr style="border: none; border-top: 1px solid #eeeeee;
                   margin: 28px 0;">

    <p style="font-size: 12px; color: #777777;">
        CarSales — Your next car starts here.
    </p>
</div>
</body>
</html>
