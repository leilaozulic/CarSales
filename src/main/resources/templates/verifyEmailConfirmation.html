<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify your email - CarSales</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 560px;
             margin: 60px auto; padding: 24px; text-align: center;">

<h1>Verify your email</h1>

<p>Click below to confirm your email address and activate your CarSales account.</p>

<form method="post" th:action="@{/verify-email}">
    <input name="token" th:value="${token}" type="hidden">

    <button style="padding: 12px 24px; background: #2563eb;
                       color: white; border: none; border-radius: 6px;
                       cursor: pointer;"
            type="submit">
        Confirm email
    </button>
</form>

</body>
</html>
