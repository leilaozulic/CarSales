<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Verify your email | CarSales</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="navbar">
    <div class="container nav-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">C</span>
            CarSales
        </a>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <div class="auth-heading">
            <div aria-hidden="true" class="verify-icon">✉</div>
            <div class="eyebrow">ONE LAST STEP</div>
            <h1>Verify your email.</h1>
            <p>
                You're almost ready to hit the road.
                Confirm your email address to activate your CarSales account.
            </p>
        </div>

        <form method="post" th:action="@{/verify-email}">
            <input name="token" th:value="${token}" type="hidden">

            <button class="btn btn-primary btn-full" type="submit">
                Confirm my email &rarr;
            </button>
        </form>

        <p class="verify-note">
            If you didn't create a CarSales account, you can safely
            close this page.
        </p>

        <p class="auth-switch">
            <a th:href="@{/}">← Back to homepage</a>
        </p>
    </section>
</main>

<footer class="footer">
    <div class="container footer-inner">
        <span>© 2026 CarSales</span>
        <span>Made for the road ahead.</span>
    </div>
</footer>

</body>
</html>
